name: android build

# Compila o APK Android do AoMDC (hlsdk-portable) na nuvem.
# O APK gerado é um "lançador": ele carrega as bibliotecas do jogo
# (hl.so e client.so) e abre o app Xash3D FWGS (su.xash.engine) já instalado.
#
# Onde salvar no seu fork: .github/workflows/android.yml

on:
  workflow_dispatch:
  push:
    paths-ignore:
      - 'README.md'
      - '.github/workflows/build.yml'
      - '.github/workflows/manual.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Install NDK and CMake
      run: |
        SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$SDKMANAGER" --licenses > /dev/null || true
        "$SDKMANAGER" --install "ndk;26.1.10909125" "cmake;3.22.1"

    # O projeto Android vem configurado para o gamedir "valve" (Half-Life).
    # O AoMDC usa a pasta "AoMDC" (ver GAMEDIR em mod_options.txt),
    # então trocamos nos dois lugares antes de compilar.
    - name: Set AoMDC gamedir
      run: |
        sed -i 's/"gamedir", "valve"/"gamedir", "AoMDC"/' android/app/src/main/java/su/xash/hlsdk/MainActivity.java
        sed -i 's/android:value="valve"/android:value="AoMDC"/' android/app/src/main/AndroidManifest.xml
        grep -q 'putExtra("gamedir", "AoMDC")' android/app/src/main/java/su/xash/hlsdk/MainActivity.java
        grep -q 'android:value="AoMDC"' android/app/src/main/AndroidManifest.xml

    - name: Build APK
      working-directory: android
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: aomdc-android-apk
        path: android/app/build/outputs/apk/deb
        ug/*.apk
